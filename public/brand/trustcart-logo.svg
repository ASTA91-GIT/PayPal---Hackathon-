<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="tcLogoGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="50%" stop-color="#A9D9F0" />
      <stop offset="100%" stop-color="#F0BDD3" />
    </linearGradient>
    <linearGradient id="tcSynapseLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0BDD3" />
      <stop offset="50%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#A9D9F0" />
    </linearGradient>
  </defs>

  <!-- Left Emblem (Scaled to 64x64 at x=8, y=8) -->
  <g transform="translate(8, 8) scale(0.64)">
    <!-- Outer Shield -->
    <path
      d="M50 8
         C63 8 78 12 85 18
         C86 38 84 62 50 92
         C16 62 14 38 15 18
         C22 12 37 8 50 8Z"
      stroke="url(#tcLogoGrad)"
      stroke-width="4"
      stroke-linejoin="round"
      fill="none"
    />
    <path
      d="M50 11
         C61 11 75 14.5 81.5 20
         C82.5 38 80.5 60 50 87
         C19.5 60 17.5 38 18.5 20
         C25 14.5 39 11 50 11Z"
      fill="url(#tcLogoGrad)"
      fill-opacity="0.1"
    />
    <!-- Scanning Arcs -->
    <path d="M32 28 C42 21 58 21 68 28" stroke="url(#tcSynapseLogo)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M38 34 C45 29 55 29 62 34" stroke="url(#tcSynapseLogo)" stroke-width="3" stroke-linecap="round" />
    <!-- Cart Basket -->
    <path
      d="M29 42 L35 42 L42 62 L67 62 L74 46 L38 46"
      stroke="url(#tcLogoGrad)"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path d="M45 52 L62 52" stroke="url(#tcSynapseLogo)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <!-- Synapse Nodes / Wheels -->
    <circle cx="44" cy="71" r="4" fill="#A9D9F0" />
    <circle cx="44" cy="71" r="6.5" stroke="#C4B5FD" stroke-width="1.5" opacity="0.6" />
    <circle cx="65" cy="71" r="4" fill="#F0BDD3" />
    <circle cx="65" cy="71" r="6.5" stroke="#A9D9F0" stroke-width="1.5" opacity="0.6" />
    <circle cx="50" cy="24" r="3" fill="#FFFFFF" />
  </g>

  <!-- Wordmark: TRUSTCART AI -->
  <text
    x="84"
    y="44"
    font-family="'Syne', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="800"
    font-size="24"
    letter-spacing="0.08em"
    fill="#F3F0FA"
  >TRUSTCART<tspan fill="#C4B5FD"> AI</tspan></text>

  <!-- Sub-wordmark / Tagline -->
  <text
    x="85"
    y="60"
    font-family="'JetBrains Mono', 'Courier New', monospace"
    font-weight="500"
    font-size="8.5"
    letter-spacing="0.18em"
    fill="#A9D9F0"
    opacity="0.85"
  >AUTONOMOUS SHOPPING &amp; TRUST SHIELD</text>
</svg>
