<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="tcShieldGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="50%" stop-color="#A9D9F0" />
      <stop offset="100%" stop-color="#F0BDD3" />
    </linearGradient>
    <linearGradient id="tcCartGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#9D87E8" />
      <stop offset="100%" stop-color="#5BA8C2" />
    </linearGradient>
    <linearGradient id="tcSynapseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0BDD3" />
      <stop offset="50%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#A9D9F0" />
    </linearGradient>
    <filter id="tcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Shield Perimeter with Chamfered Crest -->
  <path
    d="M50 8
       C63 8 78 12 85 18
       C86 38 84 62 50 92
       C16 62 14 38 15 18
       C22 12 37 8 50 8Z"
    stroke="url(#tcShieldGrad)"
    stroke-width="3.5"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Subtle Translucent Shield Fill -->
  <path
    d="M50 11
       C61 11 75 14.5 81.5 20
       C82.5 38 80.5 60 50 87
       C19.5 60 17.5 38 18.5 20
       C25 14.5 39 11 50 11Z"
    fill="url(#tcShieldGrad)"
    fill-opacity="0.08"
  />

  <!-- AI Neural Scanning Waves (Concentric Orbital Arcs) -->
  <path
    d="M32 28 C42 21 58 21 68 28"
    stroke="url(#tcSynapseGrad)"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.75"
  />
  <path
    d="M38 34 C45 29 55 29 62 34"
    stroke="url(#tcSynapseGrad)"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Integrated Shopping Cart Basket Geometry (Commerce + Shield Synergy) -->
  <!-- Cart Handle and Rim -->
  <path
    d="M29 42
       L35 42
       L42 62
       L67 62
       L74 46
       L38 46"
    stroke="url(#tcShieldGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Cart Front Facet / Inner Basket Core -->
  <path
    d="M45 52 L62 52"
    stroke="url(#tcSynapseGrad)"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.8"
  />

  <!-- AI Synapse Node / Wheel 1 (Pulsing Nexus) -->
  <circle cx="44" cy="71" r="3.5" fill="#A9D9F0" />
  <circle cx="44" cy="71" r="5.5" stroke="#C4B5FD" stroke-width="1.2" opacity="0.6" />

  <!-- AI Synapse Node / Wheel 2 (Pulsing Nexus) -->
  <circle cx="65" cy="71" r="3.5" fill="#F0BDD3" />
  <circle cx="65" cy="71" r="5.5" stroke="#A9D9F0" stroke-width="1.2" opacity="0.6" />

  <!-- Center AI Core / Neural Spark -->
  <circle cx="50" cy="24" r="2.5" fill="#FFFFFF" />
  <circle cx="50" cy="24" r="4.5" stroke="#C4B5FD" stroke-width="1" opacity="0.9" />
</svg>
